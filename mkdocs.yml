site_name: Guia WCorp
site_description: Central de ajuda do WCorp para usuários, suporte e desenvolvimento.
site_author: WCorp
site_url: https://suportewcorp.github.io/erp-docs/
exclude_docs: |
  shared/

theme:
  name: material
  custom_dir: overrides
  language: pt-BR
  logo: assets/wcorp-logo.png
  favicon: assets/wcorp-logo.png
  palette:
    - scheme: default
      primary: teal
      accent: cyan
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
    - toc.follow

nav:
  - Início: index.md
  - Guia:
      - Visão geral: como-fazer/index.md
      - Administração:
          - Como cadastrar uma Natureza de Operação: como-fazer/cadastrar-natureza-operacao.md
          - Como cadastrar uma Condição de Pagamento: como-fazer/cadastrar-condicao-pagamento.md
          - Como cadastrar um Centro de Custo: como-fazer/cadastrar-centro-custo.md
          - Como cadastrar um usuário: como-fazer/cadastrar-usuario.md
          - Como configurar um Grupo de Usuário: como-fazer/configurar-grupo-usuario.md
      - Comercial:
          - Como cadastrar um cliente: como-fazer/cadastrar-cliente.md
          - Como cadastrar um fornecedor: como-fazer/cadastrar-fornecedor.md
          - Como criar um orçamento: como-fazer/criar-orcamento.md
          - Como gerar um pedido: como-fazer/fazer-pedido-venda.md
      - Estoque:
          - Cadastro de Material: como-fazer/cadastrar-material.md
          - Como consultar estoque: como-fazer/consultar-estoque.md
          - Como ajustar estoque: como-fazer/ajustar-estoque.md
          - Como fazer inventário: como-fazer/fazer-inventario.md
          - Como transferir estoque: como-fazer/transferir-estoque.md
      - Faturamento:
          - Como emitir uma NF-e: como-fazer/faturar-nota.md
          - Como cancelar uma NF-e: como-fazer/cancelar-nfe.md
          - Como emitir uma devolução: como-fazer/emitir-devolucao.md
          - Como emitir uma carta de correção: como-fazer/emitir-carta-correcao.md
          - Como emitir uma nota complementar: como-fazer/emitir-nota-complementar.md
      - Compras:
          - Como importar XML: como-fazer/importar-xml.md
          - Como lançar uma nota de entrada: como-fazer/lancar-nota-entrada.md
          - Como criar um pedido de compra: como-fazer/criar-pedido-compra.md
      - Financeiro:
          - Como gerar boleto: como-fazer/gerar-boleto.md
          - Como baixar um título: como-fazer/baixar-titulo.md
          - Como lançar contas a pagar: como-fazer/lancar-contas-a-pagar.md
  - Referências:
      - Visão geral: referencia/index.md
      - Erros comuns: referencia/erros-comuns.md
      - FAQ: referencia/faq.md
      - Links úteis: referencia/links-uteis.md
      - Glossário: referencia/glossario.md
  - Favoritos: favoritos.md
  - Manual:
      - Visão geral: manual/index.md
      - Comercial:
          - Visão geral: comercial/comercial-geral.md
          - Clientes: comercial/comercial-clientes.md
          - Grupo de clientes: comercial/comercial-grupo-clientes.md
          - Orçamento: comercial/comercial-orcamento.md
          - Pedido: comercial/pedidos.md
          - Devolução: comercial/devolucao.md
      - Faturamento:
          - Visão geral: faturamento/faturamento-geral.md
          - Nota Fiscal: faturamento/faturamento-nf.md
          - Cupom Fiscal: faturamento/faturamento-nfce.md
          - Entrada de Nota Fiscal: faturamento/entrada-nota-fiscal.md
          - Carta de Correção: faturamento/carta-correcao.md
          - Inutilização Nota Fiscal: faturamento/inutilizacao-nota-fiscal.md
          - CFOP Entrada: faturamento/cfop-entrada.md
      - Financeiro:
          - Visão geral: financeiro/financeiro-geral.md
          - Contas a Pagar: financeiro/contas-a-pagar.md
          - Contas a Receber: financeiro/contas-a-receber.md
          - Boleto: financeiro/boleto.md
          - Contas: financeiro/contas.md
      - Colaboradores:
          - Visão geral: colaboradores/colaboradores-geral.md
      - Fornecedores:
          - Visão geral: fornecedores/fornecedores-geral.md
          - Fornecedores: fornecedores/fornecedores.md
      - Materiais:
          - Visão geral: materiais/materiais-geral.md
          - Materiais: materiais/materiais.md
          - Categoria de Materiais: materiais/categoria-materiais.md
          - Locais de Armazenagem: materiais/locais-armazenagem.md
          - Ajustar Inventário: materiais/ajustar-inventario.md
          - Lote/Estoque: materiais/lote-estoque.md
      - Serviços:
          - Visão geral: servicos/servicos-geral.md
      - Contratos:
          - Visão geral: contratos/contratos-geral.md
      - Compras:
          - Visão geral: compras/compras-geral.md
          - Pedido de Compra: compras/pedido-compra.md
      - Produção:
          - Visão geral: producao/producao-geral.md
      - Transportes:
          - Visão geral: transportes/transportes-geral.md
      - Relatórios:
          - Visão geral: relatorios/relatorios-geral.md
          - XML(s) NFe: relatorios/xml-nfe.md
      - Administração:
          - Visão geral: administracao/administracao-geral.md
          - Usuários: administracao/usuarios.md
          - Grupo Usuários: administracao/grupo-usuarios.md
          - Empresas: administracao/empresas.md
          - Natureza de Operação: administracao/natureza-op.md
          - Unidades: administracao/unidades.md
          - NCMS: administracao/ncms.md
          - Centro de Custo: administracao/centro-custo.md
          - Condições de Pagamento: administracao/condicoes-pagamento.md
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path:
        - docs
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - extra.css
  - assets/stylesheets/cards.css
  - assets/stylesheets/header.css
  - assets/stylesheets/knowledge-base.css
  - assets/stylesheets/alerts.css
  - assets/stylesheets/context-help.css
  - assets/stylesheets/favorites.css
  - assets/stylesheets/content-info.css
  - assets/stylesheets/assistant.css

extra_javascript:
  - assets/javascripts/wcorp-header.js
  - assets/javascripts/wcorp-nav.js
  - assets/javascripts/wcorp-video.js
  - assets/javascripts/wcorp-errors.js
  - assets/javascripts/wcorp-context-help.js
  - assets/javascripts/wcorp-favorites.js
  - assets/javascripts/wcorp-content-info.js
  - assets/javascripts/wcorp-assistant.js
  - assets/javascripts/wcorp-search.js

plugins:
  - search:
      lang: pt
  - glightbox


